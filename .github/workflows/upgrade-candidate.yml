name: Temporary upgrade candidate
on:
  push:
    branches:
      - upgrade/ci-build-20261029
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache: true
      - name: Test candidate
        run: go test -count=1 ./...
      - name: Build static Linux AMD64 candidate
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/apple-music-dl .
          sha256sum dist/apple-music-dl > dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: applemusic-upgrade-linux-amd64
          path: |
            dist/apple-music-dl
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 3
