services:
  # ============================================================
  # ===== Legacy single-account wrapper (default profile) ======
  # ============================================================
  # 用法：
  #   docker compose --profile init run --rm wrapper-init
  #
  # 先判断你机器架构：
  #   uname -m
  #
  # 常见对应：
  #   aarch64 / arm64  -> image: jelly714love/wrapper:arm64   platform: linux/arm64
  #   x86_64 / amd64   -> image: jelly714love/wrapper:amd64   platform: linux/amd64
  #
  # ARM 机器强行跑 x86 镜像也可：
  #   image: jelly714love/wrapper:amd64
  #   platform: linux/amd64
  wrapper-init:
    # 按你的机器架构修改 image / platform
    image: jelly714love/wrapper:arm64
    platform: linux/arm64
    profiles: ["init"]
    restart: "no"
    environment:
      # 改成你自己的 Apple 账号登录参数（只在初始化时使用）
      # 例：-L your_apple_id:your_password -F
      args: "-L <你的AppleID>:<你的密码> -F"
    volumes:
      - "./rootfs/data:/app/rootfs/data"

  # ========== wrapper: 常驻服务 ==========
  wrapper:
    # 按你的机器架构修改 image / platform
    image: jelly714love/wrapper:arm64
    platform: linux/arm64
    container_name: wrapper
    restart: unless-stopped
    profiles: ["wrapper"]
    environment:
      # 常驻启动参数，通常不需要改
      args: "-H 0.0.0.0 -M 20020"
    ports:
      - "10020:10020"
      - "20020:20020"
      - "30020:30020"
    volumes:
      - "./rootfs/data:/app/rootfs/data"

  # ============================================================
  # ====== Multi-account wrapper-manager + shim profile ========
  # ============================================================
  # 启动多账号方案：
  #   docker compose --profile manager up -d
  # 切换回单账号 wrapper：
  #   docker compose --profile wrapper up -d wrapper
  #
  # 多账号方案下 bot 配置完全不动，仍然指向 :10020 / :20020；
  # 这两个端口由 wrapper-shim 提供，背后是 wrapper-manager 的 gRPC。
  wrapper-manager:
    image: ghcr.io/worldobservationlog/wrapper-manager:latest
    container_name: wrapper-manager
    restart: unless-stopped
    profiles: ["manager"]
    # wrapper-manager 内部需要 PID namespace 隔离 + chroot
    privileged: true
    cap_add:
      - SYS_ADMIN
    command: ["-host", "0.0.0.0", "-port", "8080"]
    ports:
      # 仅在你需要从宿主机直接发 gRPC（比如登录账号）时暴露
      - "8080:8080"
    volumes:
      - "./wrapper-manager/data:/app/data"

  wrapper-shim:
    build:
      context: ./wrapper-shim
      dockerfile: Dockerfile
    image: applemusic-telegram-bot/wrapper-shim:local
    container_name: wrapper-shim
    restart: unless-stopped
    profiles: ["manager"]
    depends_on:
      - wrapper-manager
    command:
      - "-manager"
      - "wrapper-manager:8080"
      - "-m3u8-listen"
      - ":20020"
      - "-decrypt-listen"
      - ":10020"
      - "-wait-ready"
      - "120s"
    # 同 wrapper 的端口语义，bot 的 config.yaml 不需要改：
    #   decrypt-m3u8-port: "wrapper-shim:10020"
    #   get-m3u8-port:     "wrapper-shim:20020"
    expose:
      - "10020"
      - "20020"

  # ============================================================
  # ============= Telegram Bot API 本地服务 ====================
  # ============================================================
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      # 下面两个值请改成你自己的
      TELEGRAM_API_ID: "2040"
      TELEGRAM_API_HASH: "b18441a1ff607e10a989891a5462e627"

      # 一般不用改
      TELEGRAM_HTTP_PORT: "8081"
      TELEGRAM_LOCAL: "true"
      TELEGRAM_VERBOSITY: "2"
    volumes:
      - "./data/telegram-bot-api:/var/lib/telegram-bot-api"

  # ============================================================
  # ====================== 本项目 Bot ==========================
  # ============================================================
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: applemusic-telegram-bot
    restart: unless-stopped
    # depends_on 写两组都允许，profile 决定实际启用哪个。
    depends_on:
      - telegram-bot-api
    command: ["--bot"]
    environment:
      # 推荐把 token 写在 config.yaml 的 telegram-bot-token。
      # 如果你不想写到 config.yaml，也可以填这里。
      TELEGRAM_BOT_TOKEN: ""
      TZ: "Asia/Shanghai"
    volumes:
      # 你的主配置（必须存在）
      - "./config.yaml:/app/config.yaml:ro"
      # 下载目录
      - "./downloads:/downloads"
      # Telegram file_id 缓存目录（避免单文件 bind mount 导致 atomic rename EBUSY）
      - "./bot-runtime:/app/runtime"

# ================== 关键协调关系（必须改 config.yaml）==================
# 因为 bot 运行在容器内，不能再用 127.0.0.1 指向 wrapper / telegram-bot-api。
#
# 单账号 wrapper（profile=wrapper）：
#   decrypt-m3u8-port: "wrapper:10020"
#   get-m3u8-port: "wrapper:20020"
#
# 多账号 wrapper-manager + shim（profile=manager）：
#   decrypt-m3u8-port: "wrapper-shim:10020"
#   get-m3u8-port: "wrapper-shim:20020"
#
# 公共：
#   telegram-api-url: "http://telegram-bot-api:8081"
#   telegram-cache-file: "/app/runtime/telegram-cache.json"
#
# 启动：
#   单账号:   docker compose --profile wrapper up -d --build
#   多账号:   docker compose --profile manager up -d --build
